# Render Blueprint: NEO Pulse (Google-Ads repo) + legacy Flowbie services.
# Apply from Render Dashboard → Blueprints, or run: node scripts/render-provision-neo-pulse.mjs

services:
  - type: web
    name: neo-pulse-static
    runtime: static
    repo: https://github.com/neodigitalca/Google-Ads
    branch: main
    buildCommand: npm ci && npm run build:render-static
    staticPublishPath: dist
    envVars:
      - key: RENDER_PROFILE
        value: prod
      - key: VITE_BASE_PATH
        value: /
      - key: VITE_MCP_API_BASE
        value: https://neo-pulse-api.onrender.com/api/mcp
      - key: NEO_PULSE_RENDER_API_BASE
        value: https://neo-pulse-api.onrender.com/api/mcp
      - key: VITE_OPENROUTER_API_KEY
        sync: false

  - type: web
    name: neo-pulse-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.ld-worker
    repo: https://github.com/neodigitalca/Google-Ads
    branch: main
    plan: standard
    envVars:
      - key: LD_WORKER_AUTH_TOKEN
        sync: false
      - key: LOCAL_DOMINATOR_EMAIL
        sync: false
      - key: LOCAL_DOMINATOR_PASSWORD
        sync: false
      - key: LOCAL_DOMINATOR_LOGIN_URL
        value: https://app.localdominator.co/login/
      - key: OPENROUTER_API_KEY
        sync: false

  - type: web
    name: neo-pulse-api
    runtime: node
    repo: https://github.com/neodigitalca/Google-Ads
    branch: main
    buildCommand: npm ci
    startCommand: node scripts/neo-pulse-render-api-gateway.mjs
    plan: starter
    envVars:
      - key: FLOWBIEONE_UPSTREAM
        value: https://flowbieone.onrender.com
      - key: OLLAMA_BASE_URL
        value: https://neo-pulse-ollama.onrender.com
      - key: OLLAMA_AUTH_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  - type: web
    name: neo-pulse-ollama
    runtime: docker
    dockerfilePath: ./Dockerfile.ollama
    repo: https://github.com/neodigitalca/Google-Ads
    branch: main
    plan: standard
    disk:
      name: neo-pulse-ollama-data
      mountPath: /root/.ollama
      sizeGB: 20
    envVars:
      - key: OLLAMA_MODELS
        value: qwen3:8b
      - key: OLLAMA_AUTH_TOKEN
        sync: false

  - type: web
    name: flowbie-demo-static
    runtime: static
    repo: https://github.com/neodigitalca/flowbie1
    branch: cursor/meta-ads-visual-settings-layout
    buildCommand: npm ci && npm run build:render-static
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: RENDER_PROFILE
        value: demo
      - key: VITE_BASE_PATH
        value: /
      - key: VITE_MCP_API_BASE
        value: https://neodigital.ca/api/mcp
      - key: VITE_OPENROUTER_API_KEY
        sync: false

  - type: web
    name: flowbie-demo-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.ld-worker
    repo: https://github.com/neodigitalca/flowbie1
    branch: cursor/meta-ads-visual-settings-layout
    plan: standard
    envVars:
      - key: LD_WORKER_AUTH_TOKEN
        sync: false
      - key: LOCAL_DOMINATOR_EMAIL
        sync: false
      - key: LOCAL_DOMINATOR_PASSWORD
        sync: false
      - key: LOCAL_DOMINATOR_LOGIN_URL
        value: https://app.localdominator.co/login/
      - key: OXYLABS_PROXY_HOST
        value: pr.oxylabs.io
      - key: OXYLABS_PROXY_PORT
        value: "7777"
      - key: OXYLABS_PROXY_USERNAME
        sync: false
      - key: OXYLABS_PROXY_PASSWORD
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  - type: web
    name: flowbie-demo-ollama
    runtime: docker
    dockerfilePath: ./Dockerfile.ollama
    repo: https://github.com/neodigitalca/flowbie1
    branch: cursor/meta-ads-visual-settings-layout
    plan: standard
    disk:
      name: ollama-data-demo
      mountPath: /root/.ollama
      sizeGB: 20
    envVars:
      - key: OLLAMA_MODELS
        value: qwen3:8b
      - key: OLLAMA_AUTH_TOKEN
        sync: false

  - type: web
    name: flowbie-prod-static
    runtime: static
    repo: https://github.com/neodigitalca/flowbie1
    branch: main
    buildCommand: npm ci && npm run build:render-static
    staticPublishPath: dist
    envVars:
      - key: RENDER_PROFILE
        value: prod
      - key: VITE_BASE_PATH
        value: /
      - key: VITE_MCP_API_BASE
        value: https://neodigital.ca/api/mcp
      - key: VITE_OPENROUTER_API_KEY
        sync: false
    domains:
      - app.neodigital.ca

  - type: web
    name: flowbie-prod-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.ld-worker
    repo: https://github.com/neodigitalca/flowbie1
    branch: main
    plan: standard
    envVars:
      - key: LD_WORKER_AUTH_TOKEN
        sync: false
      - key: LOCAL_DOMINATOR_EMAIL
        sync: false
      - key: LOCAL_DOMINATOR_PASSWORD
        sync: false
      - key: LOCAL_DOMINATOR_LOGIN_URL
        value: https://app.localdominator.co/login/
      - key: OXYLABS_PROXY_HOST
        value: pr.oxylabs.io
      - key: OXYLABS_PROXY_PORT
        value: "7777"
      - key: OXYLABS_PROXY_USERNAME
        sync: false
      - key: OXYLABS_PROXY_PASSWORD
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
    domains:
      - ld.neodigital.ca

  - type: web
    name: flowbie-prod-ollama
    runtime: docker
    dockerfilePath: ./Dockerfile.ollama
    repo: https://github.com/neodigitalca/flowbie1
    branch: main
    plan: standard
    disk:
      name: ollama-data-prod
      mountPath: /root/.ollama
      sizeGB: 20
    envVars:
      - key: OLLAMA_MODELS
        value: qwen3:8b
      - key: OLLAMA_AUTH_TOKEN
        sync: false
