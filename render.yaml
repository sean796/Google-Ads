# Render Blueprint: NEO Pulse unified environment (NEOPulse Production).
# Apply from Render Dashboard -> Blueprints, or run: node scripts/render-provision-neo-pulse.mjs

services:
  - type: web
    name: neo-pulse-static
    runtime: static
    repo: https://github.com/neodigitalca/Google-Ads
    branch: main
    buildCommand: npm ci && npm run build:render-static
    staticPublishPath: dist
    envVars:
      - key: RENDER_PROFILE
        value: prod
      - key: VITE_BASE_PATH
        value: /
      - key: VITE_MCP_API_BASE
        value: https://pulse-host-wp-hub.onrender.com/api/mcp
      - key: NEO_PULSE_RENDER_API_BASE
        value: https://pulse-host-wp-hub.onrender.com/api/mcp
      - key: VITE_OPENROUTER_API_KEY
        sync: false

  - type: web
    name: neo-pulse-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.ld-worker
    repo: https://github.com/neodigitalca/Google-Ads
    branch: main
    plan: standard
    envVars:
      - key: LD_WORKER_AUTH_TOKEN
        sync: false
      - key: LOCAL_DOMINATOR_EMAIL
        sync: false
      - key: LOCAL_DOMINATOR_PASSWORD
        sync: false
      - key: LOCAL_DOMINATOR_LOGIN_URL
        value: https://app.localdominator.co/login/
      - key: OPENROUTER_API_KEY
        sync: false

  - type: web
    name: pulse-host-api
    runtime: docker
    dockerfilePath: ./Dockerfile.neo-host-api
    repo: https://github.com/neodigitalca/Google-Ads
    branch: main
    plan: standard
    region: ohio
    buildFilter:
      paths:
        - hosting/neo-host-api/**
        - hosting/agents/**
        - Dockerfile.neo-host-api
        - package.json
        - package-lock.json
    envVars:
      - key: PULSE_HOST_API_TOKEN
        sync: false
      - key: PULSE_HOST_DB_URL
        sync: false
      - key: NEO_HOST_API_TOKEN
        sync: false
      - key: NEO_HOST_DB_URL
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NEO_HOST_BOOTSTRAP_STAGING
        value: "0"
      - key: NEO_HOST_DEFAULT_REGION
        value: ohio
      - key: PULSE_HOST_RENDER_REPO
        value: https://github.com/neodigitalca/Google-Ads
      - key: PULSE_HOST_RENDER_BRANCH
        value: main
      - key: RENDER_OWNER_ID
        sync: false
      - key: PULSE_HOST_ADMIN_EMAIL
        value: sean@neodigital.ca
      - key: PULSE_ADMIN_EMAIL
        value: pulse@neodigital.ca
      - key: PULSE_ADMIN_PASSWORD_HASH
        sync: false

  # Neo Pulse hub: runs neo-pulse-app (/api/*, including /api/agent-library) for neo-pulse-static.
  - type: web
    name: pulse-host-wp-hub
    runtime: docker
    dockerfilePath: ./hosting/docker/wordpress/Dockerfile
    dockerContext: .
    repo: https://github.com/neodigitalca/Google-Ads
    branch: main
    plan: standard
    region: ohio
    buildFilter:
      paths:
        - hosting/docker/wordpress/**
        - wordpress-plugins/neo-pulse-wp/**
        - wordpress-plugins/neo-pulse-app/**
    disk:
      name: pulse-host-wp-hub-disk
      mountPath: /var/www/html/wp-content
      sizeGB: 10
    envVars:
      - key: WORDPRESS_DB_HOST
        value: pulse-host-db-hub:3306
      - key: WORDPRESS_DB_USER
        value: wordpress
      - key: WORDPRESS_DB_PASSWORD
        sync: false
      - key: WORDPRESS_DB_NAME
        value: wordpress
      - key: WORDPRESS_SITE_URL
        value: https://pulse-host-wp-hub.onrender.com
      - key: WORDPRESS_SITE_TITLE
        value: Neo Pulse Hub
      - key: WORDPRESS_ADMIN_PASSWORD
        sync: false
      - key: WORDPRESS_ADMIN_USER
        value: admin
      - key: WORDPRESS_ADMIN_EMAIL
        value: sean@neodigital.ca
      - key: NEO_PULSE_HUB
        value: "1"
      - key: PULSE_HOST_API_BASE
        value: https://pulse-host-api.onrender.com
      - key: PULSE_HOST_API_TOKEN
        sync: false
      - key: PULSE_ADMIN_EMAIL
        value: pulse@neodigital.ca
      - key: PULSE_ADMIN_PASSWORD_HASH
        sync: false

  - type: pserv
    name: pulse-host-db-hub
    runtime: docker
    dockerfilePath: ./hosting/docker/mariadb/Dockerfile
    dockerContext: .
    repo: https://github.com/neodigitalca/Google-Ads
    branch: main
    plan: starter
    region: ohio
    buildFilter:
      paths:
        - hosting/docker/mariadb/**
    disk:
      name: pulse-host-db-hub-disk
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MARIADB_ROOT_PASSWORD
        sync: false
      - key: MARIADB_PASSWORD
        sync: false
      - key: MARIADB_USER
        value: wordpress
      - key: MARIADB_DATABASE
        value: wordpress
